version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: docai_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-docai_db}
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docai_backend
    restart: always
    # Exponemos el backend al host solo si quieres acceso directo, de lo contrario Nginx se encarga
    # ports:
    #   - "8000:8000" 
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=${DB_PASS:-rootpassword}
      - DB_NAME=${DB_NAME:-docai_db}
      - DB_PORT=${DB_PORT:-3306}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - PAYPAL_CLIENT_ID_LIVE=${PAYPAL_CLIENT_ID_LIVE}
      - PAYPAL_CLIENT_SECRET_LIVE=${PAYPAL_CLIENT_SECRET_LIVE}
      - PAYPAL_MODE=${PAYPAL_MODE}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - Adsterra_API_KEY=${Adsterra_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/processed:/app/processed
      # (Opcional) Las fuentes si quieres que LibreOffice las use
      - ./backend/fonts:/app/fonts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docai_frontend
    restart: always
    ports:
      - "80:80"  # Expone la aplicación web en el puerto 80 del VPS
    depends_on:
      - backend

volumes:
  db_data:
