server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Enrutar las peticiones de la API de DocAI hacia el contenedor backend
    location ~ ^/(auth|apa|pago|admin|api/notifications|health|prueba-rapida|diagnostico-db|packs|manifest.webmanifest|sw.js|workbox)(/.*)?$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Para el frontend (React SPA), si no encuentra el archivo, devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
