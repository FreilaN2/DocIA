server {
    listen 80;
    server_name _;

    # Permitir subida de documentos .docx grandes (tesis con imágenes de hasta 100 MB)
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Nueva arquitectura de API: Todo lo que empiece con /api/ va al backend
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Mantener compatibilidad hacia atrás para webhooks externos (ej. PayPal) o rutas estáticas del backend
    location ~ ^/(pago|admin|health|prueba-rapida|diagnostico-db|packs)(/.*)?$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Para el frontend (React SPA), si no encuentra el archivo, devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
